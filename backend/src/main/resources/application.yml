# 通用配置：所有运行环境共享。
server:
  port: ${HAOXIANG_PORT:8081} # 后端服务端口

spring:
  application:
    name: haoxiang-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null  # 忽略空属性
  session:
    timeout: 60m  # 有效期60分钟
    redis:
      namespace: ${HAOXIANG_SESSION_NAMESPACE:haoxiang:session}
  servlet:
    multipart:
      max-file-size: 100MB  # 最大文件大小100MB
      max-request-size: 100MB  # 最大请求大小100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.haoxiang.mall.core.entity
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
  global-config:
    db-config:
      logic-delete-field: isDeleted # 逻辑删除字段名
      logic-delete-value: 1
      logic-not-delete-value: 0

# 滑块验证码的缓存键和有效期。
captcha:
  prefix: ${HAOXIANG_CAPTCHA_PREFIX:haoxiang:captcha:slider}
  expire:
    default: 10000
    WORD_IMAGE_CLICK: 60000
  cache:
    enabled: true
    cache-size: 20
  secondary:
    enabled: false

# 上传文件存放目录；默认位于用户目录，容器部署时通过环境变量设置持久化卷路径。
haoxiang:
  upload-dir: ${HAOXIANG_UPLOAD_DIR:${user.home}/haoxiang/uploads}
  frontend-url: ${HAOXIANG_FRONTEND_URL:http://127.0.0.1:5173/}
  view-mode: ${HAOXIANG_VIEW_MODE:false}
  view-mode-tip: ${HAOXIANG_VIEW_MODE_TIP:演示模式只允许查看}
